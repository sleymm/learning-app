spring.application.name=learning-app
server.port=${SERVER_PORT:8080}

# =====================================================================
#  DATABASE CONNECTION — PostgreSQL
#
#  Run:  mvn spring-boot:run
#  Create the database and user first: run db/create-database.sql in pgAdmin.
#
#  ${NAME:default} means: read environment variable NAME, or use the default.
#  (Same style as mp-backend.)
# =====================================================================

# --- Where the database is and how to log in ---
spring.datasource.driver-class-name=org.postgresql.Driver
# jdbc:postgresql://HOST:PORT/DATABASE?currentSchema=SCHEMA
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:learning_db}?currentSchema=${DB_SCHEMA:public}
spring.datasource.username=${DB_USER:learning_user}
spring.datasource.password=${DB_PASS:learning_pass}

# --- Connection pool (HikariCP, Spring Boot's default pool) ---
# The app keeps a few connections open and reuses them instead of
# opening a new one for every request.
spring.datasource.hikari.pool-name=DemoPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
# ms to wait for a free connection before failing
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
# ms an unused connection may sit idle before it is closed
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
# ms after which a connection is replaced, even if healthy
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# --- JPA / Hibernate ---
# The SQL "flavour" Hibernate writes. Spring can usually detect it; written out here to show it.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}

# What Hibernate does with tables on startup:
#   create-drop  build them on start, drop on stop
#   create       drop and rebuild on start
#   update       add missing tables/columns, never drop (keeps your data)
#   validate     only check the tables match the entities (mp-backend uses this, with Flyway)
#   none         do nothing
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Don't keep the database session open while the JSON is being written. (mp-backend: false too)
spring.jpa.open-in-view=false

# Store and read dates in this time zone.
spring.jpa.properties.hibernate.jdbc.time_zone=${DEFAULT_TIMEZONE:Africa/Dar_es_Salaam}

# Print the SQL Hibernate runs, so you can see what each request does.
spring.jpa.show-sql=${SHOW_QUERIES:true}
spring.jpa.properties.hibernate.format_sql=true